[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "i2rsi"
version = "2.3.0"
description = "Research-grade GeoAI workbench for reproducible remote-sensing interpretation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "I2RSI Team" },
]
dependencies = [
  "fastapi>=0.116,<1.0",
  "numpy>=2.0,<3.0",
  "pillow>=11.0,<13.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.12,<1.0",
]
geo = [
  "rasterio>=1.4,<2.0",
  "shapely>=2.1,<3.0",
]
agent = [
  "GeoAgent>=1.9,<2.0",
]
agent-openai = [
  "GeoAgent[openai]>=1.9,<2.0",
]
agent-ollama = [
  "GeoAgent[ollama]>=1.9,<2.0",
]

[project.scripts]
i2rsi = "i2rsi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["i2rsi"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
# The optional PyTorch worker is exercised in the isolated model environment.
# The base CI suite cannot import its OpenMMLab/Ultralytics dependencies.
omit = ["i2rsi/model_worker.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
